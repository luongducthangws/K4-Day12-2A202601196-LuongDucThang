name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Tạo một database Redis ảo chạy ngầm phục vụ việc test
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run unit tests
      env:
        # Cung cấp các biến môi trường giả lập cho test
        API_TOKEN: "test-token-ci"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        # Chạy toàn bộ test, nhưng bỏ qua file test_cp5 và test_bonus_cicd
        # vì nó đòi hỏi cấu hình Cloud & Badge phức tạp hơn
        pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py
